plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'dev.sprig'
}

version = mod_version
group = mod_group

// Split source sets keep client-only Minecraft classes out of `main`, so the
// Sprig code (checked against main's classpath) also runs on a dedicated server.
loom {
    splitEnvironmentSourceSets()
    mods {
        "sprig_waypoints" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

java {
    sourceCompatibility = JavaVersion.toVersion(java_version)
    targetCompatibility = JavaVersion.toVersion(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(java_version)
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', mod_version
    filesMatching('fabric.mod.json') { expand version: mod_version }
}

sprig {
    targetSourceSet = 'main'
}
