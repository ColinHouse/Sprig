# The default Sprig package registry: an index of where the first-party
# libraries live. `sprig search` reads it; `sprig add NAME` turns an entry into
# an ordinary Git dependency with the listed tag and subdirectory.
[registry]
name = "sprig"
description = "First-party Sprig libraries from the Sprig repository"
# The default registry is strict: every release is a tag pinned to its commit,
# every entry names its license and owners, and a published release never
# changes (CI enforces it on pull requests to this directory).
strict = "true"
