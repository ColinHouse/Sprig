name: Release

# Builds the SDK archive and publishes it as a GitHub prerelease when a
# v* tag is pushed. Run scripts/test.sh locally or wait for CI on the same
# commit before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v0.4.0-alpha.1)'
        required: true

env:
  PYTHONUTF8: "1"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build compiler
        run: python scripts/build.py
      - name: Build release archive
        env:
          SPRIG_PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/package-alpha.py --skip-build
      - name: Run tests on the tagged source
        run: python scripts/test.py
      - uses: actions/upload-artifact@v6
        with:
          name: validated-sdk
          path: dist/*
          if-no-files-found: error

  archive-validation:
    needs: package
    name: Downloaded SDK ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['17', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: validated-sdk
          path: dist
      - name: Smoke-test the actual release ZIP outside the checkout
        run: python -c "from pathlib import Path; import subprocess,sys; archive=next(Path('dist').glob('*.zip')); subprocess.run([sys.executable,'scripts/check-sdk-archive.py','--archive',str(archive)],check=True)"

  release:
    needs: archive-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          name: validated-sdk
          path: dist
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES="docs/releases/RELEASE_NOTES-${TAG}.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARG=(--notes-file "$NOTES")
          else
            NOTES_ARG=(--generate-notes)
          fi
          gh release create "$TAG" dist/*.zip dist/*.zip.sha256 \
            --title "Sprig $TAG" "${NOTES_ARG[@]}" --prerelease
