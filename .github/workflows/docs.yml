name: Deploy documentation site

# Prepared for GitHub Pages. It does not run until this repository has a
# remote and Pages is configured to use GitHub Actions as its source.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'spec/docs/**'
      - 'grammar/**'
      - 'AI_DISCLOSURE.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE_STATUS.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Build VitePress site
        working-directory: website
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          if [ "$BASE" != "/" ]; then BASE="$BASE/"; fi
          echo "Building with DOCS_BASE=$BASE"
          DOCS_BASE="$BASE" npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
