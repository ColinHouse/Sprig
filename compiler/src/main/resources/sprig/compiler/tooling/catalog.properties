help.conform.rules=conform Class to Contract, where Contract is a class of this module (or alias.Contract from an imported module) whose methods have no body, requires Class to have every method of the contract with the same parameter types, result type and rethrows, throwing no more than the contract declares; the class then goes where the contract type is expected, the contract is generated as a Java interface and the class implements it; a contract is never generic and neither is a conforming class, a contract is a type and never a requires bound, a contract has no default methods, and a contract never conforms, neither to another contract nor to a Java interface or class (deliberate rules of the 0.8 language); conform is declared in the module that declares the class, so there is no retroactive conformance and no structural conformance; conform Class to ImportedInterface declares a foreign JVM nominal contract for an existing non-generic class declared in the same module; it defines no methods and performs no adaptation; the checker verifies every supported abstract instance requirement against existing methods by exact name, arity, JVM shapes and permitted checked exceptions, then emits the interface in the class's JVM interface list; the target must be an imported public non-generic non-sealed Java interface; non-null reference parameters are checked at the foreign method entry; unrelated type, generic, nullability, callable and capability semantics are unchanged; conform Class to ImportedClass(field, ...) makes the class extend a public non-final non-generic non-sealed Java class (abstract or concrete): the named fields are passed to the one constructor their JVM shapes select, every abstract method needs a method with the exact Java signature, a method named like an inherited public or protected method must match one of its shapes exactly (it overrides it; final and static ones are rejected), inherited public members are reached on values of the class, and 'as NAME' declares the parent view: NAME.method(...) inside the class calls the inherited implementation; NAME is not a value, has no fields and cannot call abstract methods (SPR-CONFORM-PARENT); one class conform per class, interface conforms may be added; protected methods are callable only through the parent view, not on values of the class, and sprig api ImportedClass lists them under protectedMethods; super calls into other classes are outside v1
