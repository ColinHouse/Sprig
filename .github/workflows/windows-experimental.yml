name: Windows experimental
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  preview:
    name: Windows preview / JDK ${{ matrix.java }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            editors/vscode/package-lock.json
      # Windows is an experimental preview and not a required status check.
      # Every gate runs even after an earlier one fails; the final step lists
      # each failed or skipped gate in the job summary and fails the job.
      - name: Build (scripts/build.py)
        id: build
        continue-on-error: true
        run: python scripts/build.py
      - name: Tests (scripts/test.py)
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python scripts/test.py
      - name: Grammar tests (scripts/test-grammar.py)
        id: grammar
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python scripts/test-grammar.py
      - name: SDK archive (scripts/package-alpha.py + scripts/check-sdk-archive.py)
        id: archive
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/package-alpha.py --skip-build
          python scripts/check-sdk-archive.py
      - name: Documentation (scripts/check-docs.py)
        id: docs
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python scripts/check-docs.py
      - name: VS Code extension (scripts/check-editor.py)
        id: editor
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python scripts/check-editor.py
      - name: Report preview results
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JAVA_VERSION: ${{ matrix.java }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          GRAMMAR: ${{ steps.grammar.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          EDITOR: ${{ steps.editor.outcome }}
        run: |
          failed=()
          skipped=()
          {
            echo "### Windows experimental preview / JDK $JAVA_VERSION"
            echo
            echo "Not a required status check: a failed gate fails this job without blocking merges."
            echo
            echo "| Step | Outcome |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          report() {
            local step="$1" outcome="${2:-not run}"
            echo "| $step | $outcome |" >> "$GITHUB_STEP_SUMMARY"
            case "$outcome" in
              success) ;;
              failure) failed+=("$step") ;;
              *) skipped+=("$step") ;;
            esac
          }
          report "Build (scripts/build.py)" "$BUILD"
          report "Tests (scripts/test.py)" "$TESTS"
          report "Grammar tests (scripts/test-grammar.py)" "$GRAMMAR"
          report "SDK archive (scripts/package-alpha.py + scripts/check-sdk-archive.py)" "$ARCHIVE"
          report "Documentation (scripts/check-docs.py)" "$DOCS"
          report "VS Code extension (scripts/check-editor.py)" "$EDITOR"
          joined() { local text; text=$(printf '%s; ' "$@"); echo "${text%; }"; }
          if [ ${#failed[@]} -eq 0 ] && [ ${#skipped[@]} -eq 0 ]; then
            printf '\nAll preview steps passed.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          message="Windows preview on JDK $JAVA_VERSION did not pass."
          if [ ${#failed[@]} -gt 0 ]; then
            message="$message Failed: $(joined "${failed[@]}")."
          fi
          if [ ${#skipped[@]} -gt 0 ]; then
            message="$message Not run: $(joined "${skipped[@]}")."
          fi
          printf '\n**%s**\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Windows experimental / JDK $JAVA_VERSION::$message"
          exit 1
