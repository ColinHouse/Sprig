name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Pull requests are tested once, through pull_request; a branch push alone
# does not start a second copy. A newer commit on the same pull request,
# including "Update branch", cancels the run it replaces. Every main and tag
# run has a group of its own, so none of them is ever cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  # A pull request that only changes the package index under registry/ is
  # validated by the Registry workflow; the compiler matrix and the docs job
  # then succeed at once instead of being skipped, so every required check
  # still reports.
  changes:
    name: Registry-only change?
    runs-on: ubuntu-latest
    outputs:
      registry_only: ${{ steps.filter.outputs.registry_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          registry_only=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^registry/'; then
              registry_only=true
            fi
          fi
          echo "registry_only=$registry_only" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['21', '26']
    steps:
      - name: Registry-only change
        if: needs.changes.outputs.registry_only == 'true'
        run: echo "Only registry/ changed; the Registry workflow validates it."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.registry_only != 'true'
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.registry_only != 'true'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.registry_only != 'true'
        with:
          python-version: '3.12'
      - name: Build parser, compiler, and runtime
        if: needs.changes.outputs.registry_only != 'true'
        run: python scripts/build.py
      - name: Run syntax, semantics, runtime, numeric, recovery, and acceptance tests
        if: needs.changes.outputs.registry_only != 'true'
        run: python scripts/test.py
      - name: Run reference grammar harness
        if: needs.changes.outputs.registry_only != 'true'
        env:
          ANTLR_JAR: ${{ github.workspace }}/build/deps/antlr-4.13.2-complete.jar
        run: python scripts/test-grammar.py
      - name: Build and smoke-test offline Agent SDK archive
        if: needs.changes.outputs.registry_only != 'true'
        run: |
          python scripts/package-alpha.py --skip-build
          python scripts/check-sdk-archive.py

  docs:
    name: Documentation site
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Registry-only change
        if: needs.changes.outputs.registry_only == 'true'
        run: echo "Only registry/ changed; the Registry workflow validates it."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.registry_only != 'true'
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.registry_only != 'true'
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.registry_only != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.registry_only != 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build compiler for snippet verification
        if: needs.changes.outputs.registry_only != 'true'
        run: ./scripts/build.sh
      - name: Check snippets, release metadata, and VitePress site
        if: needs.changes.outputs.registry_only != 'true'
        run: ./scripts/check-docs.sh

  editor:
    name: VS Code / ${{ matrix.os }} / ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        vscode: ['1.95.3', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: python scripts/build.py
      - run: npm ci
        working-directory: editors/vscode
      - run: python scripts/check-editor.py
      - name: Test actual VS Code Extension Host
        working-directory: editors/vscode
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a npm run test:host
            SPRIG_TEST_RESTRICTED=1 xvfb-run -a npm run test:host
          else
            npm run test:host
            SPRIG_TEST_RESTRICTED=1 npm run test:host
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: sprig-vscode-${{ matrix.os }}-${{ matrix.vscode }}
          path: editors/vscode/dist/*.vsix
