schemaVersion=1
compilerVersion=0.2.0-alpha.1
languageVersion=0.8-dev
jdkMinimum=17
license=Apache-2.0
releaseStatus=development; v0.1.0-alpha.1 is the latest published prerelease; v0.8 generics core is implemented, the project system is not
commands=help,version,check,build,run,codes,explain,capabilities,api,doctor
nativeTypes=Int,Int32,BigInt,Float,Float32,Decimal,Bool,String,Unit
collectionTypes=List[T];MutableList[T];Map[K,V];MutableMap[K,V]
supportedSyntax=typed functions,classes,enums,variants,match statements,nullable types,typed catch,local modules,lambdas up to three parameters,single-parameter generic blocks,explicit Type[Arg] generic uses
unsupportedSyntax=multiple generic parameters,generic type inference,generic constraints,inheritance,match expressions,wildcard match,pipeline,macros,operator overloading,arrays,varargs
feature.variants=true
feature.matchStatement=true
feature.matchExpression=false
feature.userGenerics=true
feature.genericConstraints=false
feature.genericTypeInference=false
feature.genericVariance=false
feature.packageManifest=false
feature.lockfile=false
feature.localDependencies=false
feature.gitDependencies=false
feature.mavenDependencies=false
feature.centralSprigRegistry=false
feature.inheritance=false
feature.nullableTypes=true
feature.thirdPartyClasspath=true
feature.sourceModules=true
feature.jsonDiagnostics=true
lambdaMaxArity=3
numericProfile=checked-fixed-integers; explicit divTrunc; no implicit mixed numeric promotion; IEEE binary floating point
jvmProfile=public reflection metadata; conservative nullable reference results; no Java array or varargs arguments
classpathPolicy=Repeat --classpath; each value uses the platform path separator. Paths resolve against the current working directory. Parent loader wins, then entries in supplied order.
help.language.syntax=print("Hello, Sprig!") | func greet(name: String) -> Unit: |     print("Hello, " + name)
help.language.rules=Top-level statements execute in source order; a function named main is not called automatically; indent with spaces; every named function declares parameter and result types; imports precede declarations; no implicit truthiness
help.language.examples=examples/hello.spr
help.types.syntax=let x: Int = 3 | var y = "text" | let maybe: String? = null
help.types.rules=Int is signed 64-bit; Int32 is signed 32-bit; Float is binary64; locals may infer types; no implicit lossy numeric conversion
help.types.examples=website/snippets/variables.spr
help.functions.syntax=func add(a: Int, b: Int) -> Int: |     return a + b | print(add(2, 3))
help.functions.rules=Parameters and return types are explicit; calls use positional arguments; Unit is a result type only
help.functions.examples=website/snippets/functions.spr
help.classes.syntax=class Person: |     let name: String |     let age: Int = 0 | let p = Person(name="Ada")
help.classes.rules=Fields have explicit types; constructors use named arguments; methods may access current-object fields implicitly
help.classes.examples=website/snippets/classes.spr
help.variants.syntax=variant Expr: |     Literal(value: Int) |     Add(left: Expr, right: Expr)
help.variants.rules=Cases have immutable named payloads; construct with Expr.Literal(value=3); cases are closed
help.variants.examples=website/snippets/variants.spr
help.match.syntax=match expr: |     case Expr.Literal as literal: |         print(literal.value) |     case Expr.Add as add: |         print(add.left)
help.match.rules=match is a statement; list every case explicitly; no wildcard or default; case binders have the case payload type
help.match.examples=tests/visitor/ast_visitor.spr
help.nullability.syntax=let value: String? = null | if value != null: |     print(value)
help.nullability.rules=Only T? admits null; check before dereference; Java reference results are conservatively nullable
help.nullability.examples=website/snippets/nullable.spr
help.errors.syntax=func checkout(quantity: Int) -> Int throws Error: |     if quantity <= 0: |         throw Error("quantity must be positive") |     return quantity
help.errors.rules=Recoverable errors use throws and typed catch; unhandled checked Java exceptions are diagnosed
help.errors.examples=website/snippets/errors.spr
help.collections.syntax=let xs: List[Int] = [1, 2] | let ys = xs.toMutableList()
help.collections.rules=List and Map are read-only; MutableList and MutableMap allow mutation; snapshots are explicit
help.collections.examples=website/snippets/collections.spr
help.numerics.syntax=let x: Int = 4 | let q = x.divTrunc(2)
help.numerics.rules=Int and Int32 arithmetic checks overflow; integer / is rejected; floating values use IEEE 754; conversions with possible loss require explicit methods
help.numerics.examples=examples/numeric_science.spr
help.modules.syntax=import "math.spr" as math
help.modules.rules=File imports are relative to the importing file; cycles are rejected; Java class imports use aliases
help.modules.examples=website/snippets/modules/main.spr
help.jvm.syntax=import java.time.LocalDate as LocalDate | let today = LocalDate.now()
help.jvm.rules=Run sprig api CLASS --json before calling Java; Java methods use positional arguments; reference results may be null; arrays and varargs are unsupported
help.jvm.examples=website/snippets/jvm_interop.spr
help.agents.syntax=sprig capabilities --json | sprig help match --json | sprig api java.time.LocalDate --member of --json | sprig check file.spr --json | sprig explain SPR-CODE --json
help.agents.rules=Query current capabilities before generating syntax; use diagnostics to repair code; do not guess unsupported features
help.agents.examples=AGENT_GUIDE.md
help.generics.syntax=generic T: |     class Box: |         let value: T | let box = Box[Int](value=1)
help.generics.rules=One type parameter per generic block; the parameter is visible only inside the block; every generic use writes explicit [Type] arguments and there is no inference; generic types are invariant; a bare T has no operators or methods; requires clauses are parsed but capabilities are not implemented in this alpha; generic variants use the expanded payload form and Option[Int].Some(value=1)
help.generics.examples=website/snippets/generics.spr
