name: CI

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['17', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build parser, compiler, and runtime
        run: python scripts/build.py
      - name: Run syntax, semantics, runtime, numeric, recovery, and acceptance tests
        run: python scripts/test.py
      - name: Run reference grammar harness
        env:
          ANTLR_JAR: ${{ github.workspace }}/tools/antlr-4.13.2-complete.jar
        run: python tools/test-grammar.py
      - name: Build and smoke-test offline Agent SDK archive
        run: |
          python scripts/package-alpha.py --skip-build
          python tools/check-sdk-archive.py

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build compiler for snippet verification
        run: ./scripts/build.sh
      - name: Check snippets, release metadata, and VitePress site
        run: ./scripts/check-docs.sh

  editor:
    name: VS Code / ${{ matrix.os }} / ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        vscode: ['1.95.3', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: python scripts/build.py
      - run: npm ci
        working-directory: editors/vscode
      - run: python scripts/check-editor.py
      - name: Test actual VS Code Extension Host
        working-directory: editors/vscode
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a npm run test:host
            SPRIG_TEST_RESTRICTED=1 xvfb-run -a npm run test:host
          else
            npm run test:host
            SPRIG_TEST_RESTRICTED=1 npm run test:host
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: sprig-vscode-${{ matrix.os }}-${{ matrix.vscode }}
          path: editors/vscode/dist/*.vsix
