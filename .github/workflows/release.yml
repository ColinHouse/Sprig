name: Release

# Builds the candidate archive and publishes it as a GitHub prerelease when a
# v* tag is pushed. Run scripts/test.sh locally or wait for CI on the same
# commit before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v0.1.0-alpha.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build compiler and run tests
        run: |
          ./scripts/build.sh
          ./scripts/test.sh
      - name: Build candidate archive
        env:
          SPRIG_PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./scripts/package-alpha.sh
      - name: Smoke-test archive outside the checkout
        run: python3 tools/check-sdk-archive.py
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES="docs/releases/RELEASE_NOTES-${TAG}.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARG=(--notes-file "$NOTES")
          else
            NOTES_ARG=(--generate-notes)
          fi
          gh release create "$TAG" dist/*.zip dist/*.zip.sha256 \
            --title "Sprig $TAG" "${NOTES_ARG[@]}" --prerelease
