commands=help,version,check,build,run,test,codes,explain,capabilities,api,wrap,doctor,init,resolve,add,remove,project,deps,upgrade,fmt,lsp
nativeTypes=Int,Int32,BigInt,Float,Float32,Decimal,Bool,String,Unit
collectionTypes=List[T];MutableList[T];Map[K,V];MutableMap[K,V]
supportedSyntax=typed functions,source function types fn(A) -> R,classes,enums,variants,match statements,match expressions,explicit declaration reexports,nullable types,typed catch,local modules,lambdas up to three parameters,generic blocks with one or more type parameters,explicit Type[Arg] generic uses,Equatable capability,declared foreign JVM conformance (conform Class to ImportedInterface)
unsupportedSyntax=generic type inference,variance,inheritance,interfaces,arbitrary Java SAM,annotations,decorators,macros,reflection-based schemas,block lambdas,named function references,tuples,destructuring,string interpolation,Char type,async/await,wildcard match,pipeline,operator overloading,arrays,varargs
